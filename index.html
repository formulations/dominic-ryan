  <style>

    :root{
      --bg:#f2ede6;
      --paper:#fbf8f2;
      --ink:#51463e;
      --soft-ink:#655d56;
      --muted:#84776d;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      overflow-x:hidden;
    }


    /* BACKGROUND DR WATERMARK */

    .background-dr{
      position:fixed;
      right:-42px;
      bottom:-52px;
      width:clamp(280px,30vw,520px);
      height:auto;
      z-index:0;
      pointer-events:none;
      user-select:none;
      opacity:.075;
      overflow:visible;
    }

    .background-dr img{
      display:block;
      width:100%;
      height:auto;
      object-fit:contain;
      filter:saturate(.65) sepia(.12);
    }

    .site-shell{
      position:relative;
      z-index:1;
      width:100%;
      min-height:100vh;
    }

    .header{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:40px;
      padding:34px 42px 0;
    }

    .brand{
      display:flex;
      align-items:flex-start;
      gap:20px;
    }

    .brand-mark{
      width:72px;
      height:auto;
      flex:none;
    }

    .brand-mark img{
      display:block;
      width:100%;
      height:auto;
    }

      font-weight:400;
      line-height:1.15;
      letter-spacing:.24em;
      color:#4e443d;
    }
